<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puffin on a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b9d9; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-family: system-ui, sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px;
    pointer-events: none; user-select: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="info">Puffin on a Bicycle — drag to orbit, scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9d9);
scene.fog = new THREE.Fog(0x87b9d9, 18, 42);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(4.5, 3.2, 6.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x5a7a4a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 2.1);
sun.position.set(6, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc8ff, 0.5);
fill.position.set(-6, 4, -4);
scene.add(fill);

// ---------- Environment ----------
// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x6fa84f, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Simple path
const path = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 1.6),
  new THREE.MeshStandardMaterial({ color: 0xc9b48a, roughness: 1 })
);
path.rotation.x = -Math.PI / 2;
path.position.y = 0.01;
path.receiveShadow = true;
scene.add(path);

// Rocks
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.95 });
for (let i = 0; i < 14; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.5, 0), rockMat);
  const a = Math.random() * Math.PI * 2;
  const d = 6 + Math.random() * 14;
  r.position.set(Math.cos(a) * d, 0.15, Math.sin(a) * d);
  r.scale.y = 0.6 + Math.random() * 0.5;
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.castShadow = true;
  r.receiveShadow = true;
  scene.add(r);
}

// Grass tufts
const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f8a3a, roughness: 1 });
for (let i = 0; i < 60; i++) {
  const g = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.35, 4), grassMat);
  const a = Math.random() * Math.PI * 2;
  const d = 3 + Math.random() * 18;
  g.position.set(Math.cos(a) * d, 0.17, Math.sin(a) * d);
  g.rotation.z = (Math.random() - 0.5) * 0.4;
  g.castShadow = true;
  scene.add(g);
}

// Clouds
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.9 });
function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  const puffs = [
    [0, 0, 0, 1], [0.9, 0.1, 0.1, 0.8], [-0.9, 0.05, -0.1, 0.75],
    [0.4, 0.4, 0.2, 0.7], [-0.4, 0.35, -0.2, 0.65]
  ];
  for (const [px, py, pz, ps] of puffs) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(ps, 12, 10), cloudMat);
    m.position.set(px, py, pz);
    g.add(m);
  }
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  return g;
}
scene.add(makeCloud(-9, 7, -8, 1.6));
scene.add(makeCloud(8, 8.5, -10, 2.0));
scene.add(makeCloud(2, 9.5, -14, 1.4));

// ---------- Materials ----------
const mat = {
  frame: new THREE.MeshStandardMaterial({ color: 0xd94f3d, roughness: 0.35, metalness: 0.55 }),
  frameDark: new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.5, metalness: 0.4 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.9 }),
  rim: new THREE.MeshStandardMaterial({ color: 0xcfd6dc, roughness: 0.3, metalness: 0.85 }),
  spoke: new THREE.MeshStandardMaterial({ color: 0xe8edf2, roughness: 0.25, metalness: 0.9 }),
  marker: new THREE.MeshStandardMaterial({ color: 0xffa500, roughness: 0.4, metalness: 0.2, emissive: 0x552200 }),
  crank: new THREE.MeshStandardMaterial({ color: 0x9aa4ad, roughness: 0.3, metalness: 0.9 }),
  pedal: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 }),
  saddle: new THREE.MeshStandardMaterial({ color: 0x3b2a1e, roughness: 0.8 }),
  // Puffin
  bodyBlack: new THREE.MeshStandardMaterial({ color: 0x1c1f26, roughness: 0.75 }),
  bellyWhite: new THREE.MeshStandardMaterial({ color: 0xf3f1ea, roughness: 0.8 }),
  beakOrange: new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.5 }),
  beakYellow: new THREE.MeshStandardMaterial({ color: 0xffc94a, roughness: 0.5 }),
  beakGrey: new THREE.MeshStandardMaterial({ color: 0x8b8f96, roughness: 0.6 }),
  eyeWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
  eyeBlack: new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 }),
  footOrange: new THREE.MeshStandardMaterial({ color: 0xff8c2a, roughness: 0.6 }),
  legOrange: new THREE.MeshStandardMaterial({ color: 0xf07a24, roughness: 0.6 }),
  cheek: new THREE.MeshStandardMaterial({ color: 0xf4f0e6, roughness: 0.8 })
};

// ---------- Bicycle ----------
const bike = new THREE.Group();
scene.add(bike);

const WHEEL_R = 0.55;
const WHEELBASE = 1.55;
const AXLE_Y = WHEEL_R;
const BB = new THREE.Vector3(0, 0.72, 0);        // bottom bracket
const SEAT = new THREE.Vector3(-0.28, 1.42, 0);
const HEAD_TOP = new THREE.Vector3(0.72, 1.42, 0);
const HEAD_BOT = new THREE.Vector3(0.62, 1.02, 0);

const frontAxle = new THREE.Vector3(WHEELBASE * 0.5, AXLE_Y, 0);
const rearAxle = new THREE.Vector3(-WHEELBASE * 0.5, AXLE_Y, 0);

// --- Wheel builder ---
function buildWheel(axle, name) {
  const g = new THREE.Group();
  g.position.copy(axle);
  g.userData.auditPart = name;

  // Tire
  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.045, 0.045, 12, 48), mat.tire);
  tire.rotation.y = Math.PI / 2;
  tire.castShadow = true;
  g.add(tire);

  // Rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.09, 0.022, 10, 48), mat.rim);
  rim.rotation.y = Math.PI / 2;
  rim.castShadow = true;
  g.add(rim);

  // Hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 12), mat.rim);
  hub.rotation.z = Math.PI / 2;
  hub.castShadow = true;
  g.add(hub);

  // Spokes
  const spokeGeo = new THREE.CylinderGeometry(0.006, 0.006, (WHEEL_R - 0.1) * 2, 4);
  for (let i = 0; i < 12; i++) {
    const s = new THREE.Mesh(spokeGeo, mat.spoke);
    s.rotation.x = (i / 12) * Math.PI * 2;
    s.rotation.z = Math.PI / 2;
    s.castShadow = true;
    g.add(s);
  }

  // Rim marker (orange reflector tip on a spoke)
  const marker = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.09, 0.045), mat.marker);
  marker.position.set(0, WHEEL_R - 0.13, 0);
  marker.castShadow = true;
  marker.userData.auditPart = 'rim_marker';
  g.add(marker);

  // Axle nut caps
  for (const s of [-1, 1]) {
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.03, 8), mat.crank);
    nut.rotation.z = Math.PI / 2;
    nut.position.x = s * 0.09;
    g.add(nut);
  }

  return g;
}

const frontWheel = buildWheel(frontAxle, 'front_wheel');
const rearWheel = buildWheel(rearAxle, 'rear_wheel');
bike.add(frontWheel, rearWheel);

// --- Frame tubes ---
function tube(a, b, radius, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, 10);
  const m = new THREE.Mesh(geo, material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

bike.add(tube(BB, SEAT, 0.035, mat.frame));                     // seat tube
bike.add(tube(SEAT, HEAD_TOP, 0.033, mat.frame));               // top tube
bike.add(tube(BB, HEAD_BOT, 0.04, mat.frame));                  // down tube
bike.add(tube(HEAD_BOT, HEAD_TOP, 0.045, mat.frame));           // head tube
bike.add(tube(BB, rearAxle, 0.028, mat.frame));                 // chain stay
bike.add(tube(SEAT, rearAxle, 0.026, mat.frame));               // seat stay
bike.add(tube(HEAD_BOT, frontAxle, 0.028, mat.frameDark));      // fork
bike.add(tube(HEAD_TOP, new THREE.Vector3(HEAD_TOP.x, HEAD_TOP.y + 0.12, 0), 0.03, mat.frameDark)); // stem riser

// Handlebar
const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.62, 10), mat.frameDark);
bar.position.set(HEAD_TOP.x, HEAD_TOP.y + 0.14, 0);
bar.rotation.x = Math.PI / 2;
bar.castShadow = true;
bike.add(bar);
for (const s of [-1, 1]) {
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.14, 10), mat.pedal);
  grip.position.set(HEAD_TOP.x, HEAD_TOP.y + 0.14, s * 0.26);
  grip.rotation.x = Math.PI / 2;
  grip.castShadow = true;
  bike.add(grip);
}

// Seat post + saddle
bike.add(tube(SEAT, new THREE.Vector3(SEAT.x, SEAT.y + 0.16, 0), 0.025, mat.frameDark));
const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), mat.saddle);
saddle.scale.set(1.5, 0.42, 0.75);
saddle.position.set(SEAT.x - 0.02, SEAT.y + 0.19, 0);
saddle.castShadow = true;
bike.add(saddle);

// Chainring (visual)
const chainring = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.02, 8, 24), mat.rim);
chainring.position.copy(BB);
chainring.rotation.y = Math.PI / 2;
bike.add(chainring);

// --- Cranks + pedals + feet (rotating assembly) ---
const crankAssembly = new THREE.Group();
crankAssembly.position.copy(BB);
bike.add(crankAssembly);

const CRANK_LEN = 0.26;
const PEDAL_Z = 0.19;

const crankL = new THREE.Group();     // rotates about X
const crankR = new THREE.Group();
crankAssembly.add(crankL, crankR);

function buildCrank(side, group) {
  const s = side === 'L' ? 1 : -1;
  // arm
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05, CRANK_LEN, 0.04), mat.crank);
  arm.position.set(0, -CRANK_LEN / 2, s * 0.09);
  arm.castShadow = true;
  group.add(arm);

  // crank tip / bolt at end of arm (rotating part)
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.05, 10), mat.crank);
  tip.rotation.z = Math.PI / 2;
  tip.position.set(0, -CRANK_LEN, s * 0.09);
  tip.castShadow = true;
  tip.userData.auditPart = 'crank_' + side;
  group.add(tip);

  // pedal platform
  const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.03, 0.09), mat.pedal);
  pedal.position.set(0, -CRANK_LEN, s * PEDAL_Z);
  pedal.castShadow = true;
  pedal.userData.auditPart = 'pedal_' + side;
  group.add(pedal);

  // foot (main visible mesh)
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.11), mat.footOrange);
  foot.position.set(0.01, -CRANK_LEN + 0.045, s * PEDAL_Z);
  foot.castShadow = true;
  foot.userData.auditPart = 'foot_' + side;
  group.add(foot);

  // toes
  for (let i = -1; i <= 1; i++) {
    const toe = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), mat.footOrange);
    toe.scale.set(1.6, 0.7, 0.8);
    toe.position.set(0.11, -CRANK_LEN + 0.04, s * PEDAL_Z + i * 0.032);
    toe.castShadow = true;
    group.add(toe);
  }
}
buildCrank('L', crankL);
buildCrank('R', crankR);

// ---------- Puffin ----------
const puffin = new THREE.Group();
puffin.position.set(-0.05, 0, 0);
scene.add(puffin);

// Torso (distinct visible mesh)
const torso = new THREE.Group();
torso.userData.auditPart = 'torso';
puffin.add(torso);

const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 20), mat.bodyBlack);
bodyMesh.scale.set(1.0, 1.25, 0.82);
bodyMesh.position.set(-0.02, 1.72, 0);
bodyMesh.castShadow = true;
torso.add(bodyMesh);

// White belly
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), mat.bellyWhite);
belly.scale.set(0.85, 1.15, 0.6);
belly.position.set(0.06, 1.66, 0);
belly.castShadow = true;
torso.add(belly);

// Head
const head = new THREE.Group();
head.position.set(0.06, 2.12, 0);
torso.add(head);

const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16), mat.bodyBlack);
headMesh.scale.set(1.0, 1.0, 0.95);
headMesh.castShadow = true;
head.add(headMesh);

// Cheeks (white face patch)
for (const s of [-1, 1]) {
  const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 12), mat.cheek);
  cheek.scale.set(0.85, 1.0, 0.7);
  cheek.position.set(0.10, -0.01, s * 0.115);
  cheek.castShadow = true;
  head.add(cheek);
}

// Eyes
for (const s of [-1, 1]) {
  const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), mat.eyeWhite);
  eyeW.position.set(0.155, 0.035, s * 0.10);
  head.add(eyeW);
  const eyeB = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8), mat.eyeBlack);
  eyeB.position.set(0.185, 0.035, s * 0.105);
  head.add(eyeB);
  // eye ring accent
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 6, 14), mat.beakOrange);
  ring.position.set(0.155, 0.035, s * 0.10);
  ring.rotation.y = Math.PI / 2;
  head.add(ring);
}

// Beak: grey base, orange middle, yellow tip (puffin style)
const beakBase = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.14, 14), mat.beakGrey);
beakBase.rotation.z = -Math.PI / 2;
beakBase.position.set(0.26, 0.0, 0);
beakBase.castShadow = true;
head.add(beakBase);

const beakMid = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.16, 14), mat.beakOrange);
beakMid.rotation.z = -Math.PI / 2;
beakMid.position.set(0.36, 0.0, 0);
beakMid.castShadow = true;
head.add(beakMid);

const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.12, 14), mat.beakYellow);
beakTip.rotation.z = -Math.PI / 2;
beakTip.position.set(0.46, -0.005, 0);
beakTip.castShadow = true;
head.add(beakTip);

// Beak ridge line
const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.02, 0.03), mat.beakOrange);
ridge.position.set(0.34, 0.03, 0);
head.add(ridge);

// A little crest tuft
for (let i = 0; i < 3; i++) {
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.12, 6), mat.bodyBlack);
  tuft.position.set(-0.12 - i * 0.02, 0.17 + i * 0.02, (i - 1) * 0.03);
  tuft.rotation.z = 0.5 + i * 0.15;
  head.add(tuft);
}

// Wings (folded along body)
for (const s of [-1, 1]) {
  const wing = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12), mat.bodyBlack);
  wing.scale.set(1.15, 0.55, 0.35);
  wing.position.set(-0.06, 1.78, s * 0.26);
  wing.rotation.x = s * 0.15;
  wing.castShadow = true;
  torso.add(wing);
}

// Tail
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 8), mat.bodyBlack);
tail.rotation.z = Math.PI / 2 + 0.5;
tail.position.set(-0.34, 1.62, 0);
tail.castShadow = true;
torso.add(tail);

// ---------- Legs ----------
// Hip positions on the body
const hipL = new THREE.Vector3(0.02, 1.42, 0.13);
const hipR = new THREE.Vector3(0.02, 1.42, -0.13);

const thighL = new THREE.Group();
const thighR = new THREE.Group();
thighL.position.copy(hipL);
thighR.position.copy(hipR);
puffin.add(thighL, thighR);

function buildLeg(side, thighGroup) {
  const s = side === 'L' ? 1 : -1;
  // Thigh (visible segment)
  const thighMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.26, 6, 10), mat.legOrange);
  thighMesh.position.set(0, -0.16, 0);
  thighMesh.castShadow = true;
  thighMesh.userData.auditPart = 'thigh_' + side;
  thighGroup.add(thighMesh);

  // Shin group (child of thigh at knee)
  const shinGroup = new THREE.Group();
  shinGroup.position.set(0, -0.32, 0);
  thighGroup.add(shinGroup);

  const shinMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.26, 6, 10), mat.legOrange);
  shinMesh.position.set(0, -0.16, 0);
  shinMesh.castShadow = true;
  shinMesh.userData.auditPart = 'shin_' + side;
  shinGroup.add(shinMesh);

  return shinGroup;
}

const shinL = buildLeg('L', thighL);
const shinR = buildLeg('R', thighR);

// ---------- Animation state ----------
const CYCLE = 2.0; // seconds per full pedal cycle
const WHEEL_CIRC = Math.PI * 2 * (WHEEL_R - 0.045);
const GEAR_RATIO = 2.2; // wheel turns per crank turn
let time = 0;
let paused = false;

// For leg IK: knee bends forward, so solve in the sagittal (x,y) plane.
const L1 = 0.32; // thigh length
const L2 = 0.32; // shin length

// Solve 2-bone IK in XY plane. Returns knee angle offsets for thigh & shin.
function solveLeg(hip, target) {
  // Work in hip-local coordinates (only x,y matter)
  const dx = target.x - hip.x;
  const dy = target.y - hip.y;
  let dist = Math.hypot(dx, dy);
  const maxReach = L1 + L2 - 0.001;
  const minReach = Math.abs(L1 - L2) + 0.001;
  dist = Math.max(minReach, Math.min(maxReach, dist));

  // Angle of hip->target from -Y (down) axis
  const baseAngle = Math.atan2(dx, -dy);

  // Law of cosines for angle at hip between thigh and hip->target line
  const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
  const A = Math.acos(Math.max(-1, Math.min(1, cosA)));

  // Knee bends forward (+x direction), so thigh rotates by -A from the line
  const thighAngle = baseAngle - A;

  // Angle at knee between thigh extension and shin
  const cosK = (L1 * L1 + L2 * L2 - dist * dist) / (2 * L1 * L2);
  const K = Math.acos(Math.max(-1, Math.min(1, cosK)));
  // Interior angle; shin direction relative to thigh = PI - K (bend forward)
  const shinAngle = Math.PI - K;

  return { thighAngle, shinAngle };
}

// Pedal target positions in world-ish (puffin-local) coordinates
// Crank center in puffin local space:
const crankCenterLocal = new THREE.Vector3(BB.x - puffin.position.x, BB.y, 0);

function updatePedaling(t) {
  const theta = (t / CYCLE) * Math.PI * 2;

  // Cranks rotate about X axis. Left and right are 180° apart.
  crankL.rotation.x = theta;
  crankR.rotation.x = theta + Math.PI;

  // Wheel rotation: consistent with crank (chain drive)
  const wheelAngle = theta * GEAR_RATIO;
  frontWheel.rotation.x = wheelAngle;
  rearWheel.rotation.x = wheelAngle;

  // Body bob in coordination with pedaling
  const bob = Math.sin(theta * 2) * 0.012;
  torso.position.y = bob;
  torso.rotation.z = Math.sin(theta) * 0.02;

  // Compute pedal positions in puffin local space
  // Crank tip local offset from BB: (0, -CRANK_LEN, ±PEDAL_Z) rotated about X by theta
  function pedalPos(phase, sideSign) {
    const ang = theta + phase;
    // rotation about X: y' = y cos - z sin ; z' = y sin + z cos
    const y0 = -CRANK_LEN;
    const z0 = sideSign * PEDAL_Z;
    const py = y0 * Math.cos(ang) - z0 * Math.sin(ang);
    const pz = y0 * Math.sin(ang) + z0 * Math.cos(ang);
    return new THREE.Vector3(
      crankCenterLocal.x,
      crankCenterLocal.y + py,
      pz
    );
  }

  const targetL = pedalPos(0, 1);       // left pedal
  const targetR = pedalPos(Math.PI, -1); // right pedal

  // Solve IK for each leg (in local XY, ignoring z since legs are nearly planar)
  const solL = solveLeg(hipL, targetL);
  const solR = solveLeg(hipR, targetR);

  // Apply thigh rotations (about Z axis)
  thighL.rotation.z = solL.thighAngle;
  thighR.rotation.z = solR.thighAngle;

  // Apply shin rotations (relative to thigh)

// ---------- View presets ----------
function setView(v) {
  if (v === 'hero') {
    camera.position.set(4.5, 3.2, 6.5);
    controls.target.set(0, 1.1, 0);
  } else if (v === 'side') {
    camera.position.set(0.2, 1.5, 8.5);
    controls.target.set(0, 1.1, 0);
  } else if (v === 'front') {
    camera.position.set(7.5, 1.8, 0.5);
    controls.target.set(0, 1.1, 0);
  }
  controls.update();
}

// ---------- Observation interface ----------
window.__pelicanLab = {
  ready: true,
  setPaused(p) {
    paused = !!p;
    renderFrame();
  },
  setView(v) {
    setView(v);
    renderFrame();
  },
  setTime(seconds) {
    time = Math.max(0, Number(seconds) || 0);
    updatePedaling(time);
    renderFrame();
  }
};

// ---------- Render loop ----------
function renderFrame() {
  controls.update();
  renderer.render(scene, camera);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!paused) {
    time += dt;
  }
  updatePedaling(time);
  renderFrame();
}
